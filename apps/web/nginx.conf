# ---------------------------------------------------------------------------
# Tầng chặn flood #1 (xem apps/api/app/ratelimit.md cho bức tranh 3 tầng)
# ---------------------------------------------------------------------------
# File này được include vào context `http` của nginx (conf.d/default.conf) nên
# các directive `map` / `limit_*_zone` dưới đây hợp lệ ở đầu file.
#
# ⚠️ IP THẬT: nginx không bao giờ thấy client trực tiếp, luôn có một proxy đứng
# trước. Giới hạn theo `$remote_addr` trần thì TOÀN BỘ người dùng dùng CHUNG một
# hạn mức — vừa vô dụng trước tấn công, vừa tự chặn nhầm chính mình.
#
# Từ 2026-08-22 tunnel đã gỡ: Caddy trên host nhận 443 rồi proxy vào đây, nên
# `$remote_addr` là 172.18.0.1 (gateway docker). Caddy nối IP thật của client
# vào cuối `X-Forwarded-For`, và `real_ip` dưới đây khôi phục `$remote_addr` về
# đúng IP đó. Thiếu ba dòng này thì `/api/v1/auth/*` chỉ còn 20 request MỘT PHÚT
# cho cả hệ thống và không ai đăng nhập được.
#
# `recursive on` + chỉ tin dải docker khiến client không giả mạo được: nginx
# duyệt `X-Forwarded-For` từ PHẢI sang trái và dừng ở entry đầu tiên nằm ngoài
# dải tin cậy — đúng bằng IP mà Caddy vừa nối vào, không phải chuỗi client tự khai.
set_real_ip_from  172.18.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# Nếu sau này bật lại proxy Cloudflare (mây cam), Cloudflare GHI ĐÈ
# `CF-Connecting-IP` bằng IP thật và client không giả mạo xuyên qua được, nên nó
# được ưu tiên. Rỗng (đi thẳng, hoặc extension → localhost:18000) thì rơi về
# `$remote_addr` — giờ đã là IP thật nhờ `real_ip` ở trên.
map $http_cf_connecting_ip $client_ip {
    default   $http_cf_connecting_ip;
    ""        $remote_addr;
}

# Zone giữ trạng thái theo IP. Kích thước nhỏ có chủ đích: container web bị
# giới hạn RAM (WEB_MEM_LIMIT), mà zone là shared memory cấp phát NGAY lúc khởi
# động. 1m ≈ 16 nghìn IP — thừa cho tải thật; zone đầy thì nginx trả 503 cho IP
# mới nhất, nên api (đường nóng) được cấp rộng hơn.
limit_req_zone  $client_ip zone=api_general:5m rate=30r/s;
limit_req_zone  $client_ip zone=api_auth:1m    rate=20r/m;
limit_req_zone  $client_ip zone=api_webhook:1m rate=2r/s;
limit_conn_zone $client_ip zone=api_conn:1m;

# 429 (mặc định của nginx là 503). Client — nhất là extension — phân biệt được
# "bị giới hạn nhịp" với "server chết" để tự lùi nhịp thay vì retry dồn dập.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chống slowloris: giữ kết nối rồi nhỏ giọt từng byte là cách làm cạn worker
    # rẻ nhất. Cắt sớm những kết nối không chịu gửi xong request.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    # Phải KHỚP với RATE_LIMIT_MAX_BODY_BYTES phía API (8MB).
    client_max_body_size  8m;

    # Assets có hash trong tên (Vite: /assets/index-<hash>.js). Nội dung đổi →
    # tên đổi, nên cache vĩnh viễn an toàn. immutable = trình duyệt không cần
    # revalidate trong suốt thời hạn.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA: mọi route không phải file tĩnh → trả index.html cho React Router.
    # index.html KHÔNG được cache: nó trỏ tới các asset có hash, nếu trình duyệt
    # giữ bản cũ thì sau khi build lại (đổi hash) user vẫn nạp bundle cũ.
    # no-store buộc mỗi lần load đều lấy index.html mới → thấy version mới ngay.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Endpoint ĐẮT nhất hệ thống: mỗi lần gọi là một lần bcrypt (~100ms CPU) hoặc
    # một email OTP. Đây là chỗ dò mật khẩu nhắm tới, và cũng là chỗ vài chục
    # request/giây đủ ghim CPU VPS → siết riêng, chặt hơn /api/ rất nhiều.
    # ⚠️ CHỈ liệt kê các path nhạy cảm, KHÔNG siết cả tiền tố /api/v1/auth/:
    # /auth/me được dashboard gọi thường xuyên, dính hạn mức 20r/m là hỏng app.
    location ~ ^/api/v1/auth/(login|register|verify-otp|resend-otp|change-password)$ {
        limit_req  zone=api_auth burst=10 nodelay;
        limit_conn api_conn 100;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $client_ip;
    }

    # Proxy API sang container backend (cùng docker network).
    location /api/ {
        # burst nodelay: cho phép dồn cục ngắn (dashboard load trang gọi hàng
        # chục API cùng lúc, extension đẩy progress mỗi 300ms) nhưng chặn dòng
        # chảy liên tục vượt 30r/s. `nodelay` = phục vụ burst NGAY thay vì xếp
        # hàng nhỏ giọt — xếp hàng ở đây chỉ làm request treo lâu hơn.
        limit_req  zone=api_general burst=120 nodelay;
        # Trần kết nối đồng thời / IP: chặn kiểu tấn công mở hàng nghìn kết nối
        # rồi bỏ đó. Đặt rộng vì SSE giữ kết nối lâu và một IP (NAT văn phòng,
        # nhiều profile MoreLogin) có thể có nhiều extension hợp lệ.
        limit_conn api_conn 100;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nguồn IP DUY NHẤT mà API tin (app/ratelimit.py::client_ip).
        # `proxy_set_header` GHI ĐÈ giá trị client tự gửi → không giả mạo được.
        proxy_set_header X-Client-IP $client_ip;

        # SSE (/api/v1/queue/stream): tắt buffering, giữ kết nối dài.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }

    location = /health {
        # KHÔNG giới hạn: healthcheck Docker + uptime monitor gọi liên tục, chặn
        # nhầm ở đây là container tự bị đánh dấu unhealthy rồi restart vòng lặp.
        proxy_pass http://api:8000/health;
        proxy_set_header X-Client-IP $client_ip;
        access_log off;
    }

    # Webhook SePay (feature 003) — SePay POST tới <domain>/webhook/sepay. Endpoint
    # nằm TOP-LEVEL (ngoài /api) nên phải proxy riêng, nếu không rơi vào SPA và trả
    # index.html thay vì tới FastAPI. Giữ nguyên header Authorization: Apikey <key>.
    # Đây là endpoint CÔNG KHAI không có JWT: chữ ký HMAC chặn được giả mạo nhưng
    # không chặn được flood, nên phải có hạn mức riêng.
    location /webhook/ {
        limit_req  zone=api_webhook burst=20 nodelay;
        limit_conn api_conn 100;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $client_ip;
    }
}

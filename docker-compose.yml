# TRẦN RAM (mem_limit) — tối ưu RAM 2026-08-04.
# Mặc định vừa VPS 2GB. Container chạm trần sẽ bị OOM-kill rồi `restart: always`
# dựng lại (mất vài giây) thay vì kéo sập cả máy. Muốn nới thì đặt trong .env:
#   API_MEM_LIMIT=1g   PG_MEM_LIMIT=512m   WEB_MEM_LIMIT=96m   CF_MEM_LIMIT=192m
# Xem container nào sát trần:  docker stats --no-stream
# Đo cho chắc thay vì đoán qua `docker stats` (nó gộp cả page cache):
#   CID=$(docker inspect -f '{{.Id}}' autogpt-postgres)
#   cat /sys/fs/cgroup/system.slice/docker-$CID.scope/memory.events   # max>0 = đã chạm trần
#   grep -E '^(anon|file|slab_reclaimable) ' .../memory.stat          # anon mới là RAM thật
# 2026-08-21: server production đã đặt PG_MEM_LIMIT=512m trong .env vì trần 384m
# bị chạm 2005 lần (phần lớn là slab reclaimable, anon thật chỉ ~25MB) → kernel
# quét thu hồi liên tục, sinh nhịp CPU sys thừa.
services:
  postgres:
    image: postgres:16-alpine
    container_name: autogpt-postgres
    restart: always
    # Postgres mặc định cấu hình cho máy chủ lớn: max_connections=100 (dự trữ
    # proc array/lock table cho đủ 100 backend) + shared_buffers=128MB. Stack này
    # chỉ mở tối đa DB_POOL_SIZE + DB_MAX_OVERFLOW (=15) kết nối từ 1 worker
    # uvicorn, cộng alembic lúc startup và psql thủ công → 30 slot là dư.
    # work_mem tính THEO node sắp xếp/hash CỦA MỖI query, không phải mỗi kết nối
    # → giữ nhỏ; báo cáo tài chính vẫn chạy được vì dữ liệu nhỏ.
    # Tắt parallel query (max_parallel_workers_per_gather=0): mỗi worker song song
    # là 1 process riêng + work_mem riêng, không đáng cho kích thước bảng ở đây.
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=1
      - -c
      - max_parallel_workers_per_gather=0
    mem_limit: ${PG_MEM_LIMIT:-384m}
    environment:
      POSTGRES_USER: autogpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autogpt}
      POSTGRES_DB: autogpt_dashboard
    volumes:
      - autogpt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autogpt"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DB không expose ra ngoài — chỉ dùng nội bộ docker network.
    # Bỏ comment nếu cần nối từ máy host (vd chạy alembic/pgcli thủ công):
    # ports:
    #   - "127.0.0.1:5432:5432"

  api:
    build: ./apps/api
    container_name: autogpt-api
    restart: always
    mem_limit: ${API_MEM_LIMIT:-768m}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://autogpt:${POSTGRES_PASSWORD:-autogpt}@postgres:5432/autogpt_dashboard
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "720"
      FRONTEND_ORIGIN: ${PUBLIC_URL:-http://localhost:17173}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@example.com}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Thiếu SUPER_ADMIN_PASSWORD trong .env}
      # Ví & SePay (feature 003-wallet-invite-payment)
      SEPAY_APIKEY: ${SEPAY_APIKEY:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      WALLET_INVITE_FEE_DEFAULT: ${WALLET_INVITE_FEE_DEFAULT:-100000}
      WALLET_TEST_USERNAME: ${WALLET_TEST_USERNAME:-wallet_tester}
      WALLET_TEST_PASSWORD: ${WALLET_TEST_PASSWORD:-}
      # Nhắc gia hạn qua Telegram (feature 004). TOKEN rỗng = TẮT tính năng.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      RENEWAL_REMINDER_DAYS: ${RENEWAL_REMINDER_DAYS:-3,1}
      RENEWAL_REMINDER_HOUR: ${RENEWAL_REMINDER_HOUR:-9}
      RENEWAL_REMINDER_UTC_OFFSET: ${RENEWAL_REMINDER_UTC_OFFSET:-7}
      # Giới hạn tài nguyên (tối ưu RAM 2026-08-04) — xem app/config.py.
      # Pool DB phải NHỎ HƠN max_connections của postgres ở trên.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      THREAD_POOL_SIZE: ${THREAD_POOL_SIZE:-16}
    ports:
      # Expose cho Chrome Extension chạy native trên Mac.
      # Trong popup extension đặt Backend URL = http://localhost:18000
      - "127.0.0.1:18000:8000"

  # ⚠️ Image này CHỈ serve `apps/web/dist` — KHÔNG còn build trong Docker.
  # Phải chạy `npm run build` ở apps/web TRƯỚC (hai script deploy đã tự làm).
  web:
    build: ./apps/web
    container_name: autogpt-web
    restart: always
    mem_limit: ${WEB_MEM_LIMIT:-64m}
    depends_on:
      - api
    ports:
      # Chỉ bind localhost; team truy cập qua Cloudflare tunnel (service web:80), không qua port này.
      - "127.0.0.1:17173:80"

  # Tunnel cho team truy cập từ xa. Chỉ chạy khi bật profile "remote":
  #   docker compose --profile remote up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: autogpt-cloudflared
    restart: always
    mem_limit: ${CF_MEM_LIMIT:-128m}
    # --protocol http2: chạy tunnel trên TCP thay vì QUIC/UDP. Nhà mạng VN bóp UDP
    # quốc tế nên QUIC hay rớt ("timeout: no recent network activity") làm API
    # thỉnh thoảng treo 1-2 giây. Đổi về http2 cho ổn định. (2026-08-19)
    command: tunnel --no-autoupdate --protocol http2 run --token ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles: ["remote"]

volumes:
  autogpt_pgdata:
